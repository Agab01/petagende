<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PetAgende - Agenda do Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-teal-700 text-white p-4 flex justify-between items-center shadow-md">
        <div class="text-xl font-bold">🐾 PetAgende | Painel da Agenda</div>
        <div class="flex items-center gap-4">
            <div class="text-sm">Olá, <b>Equipe PetAgende</b></div>
            <form action="/logout" method="POST" class="m-0">
                <button type="submit" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold shadow transition">Sair</button>
            </form>
        </div>
    </nav>

    <main class="p-8 max-w-5xl mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Agenda Geral do Dia</h2>

        <div id="listaAgendamentos">
            <p class="text-gray-500 italic">Carregando agendamentos do banco de dados...</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', carregarAgenda);

        async function carregarAgenda() {
            const container = document.getElementById('listaAgendamentos');
            
            try {
                const response = await fetch('/api/agendamentos');
                const agendamentos = await response.json();
                
                container.innerHTML = '';

                if (agendamentos.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">Nenhum agendamento para hoje.</p>';
                    return;
                }

                agendamentos.forEach(ag => {
                    const statusClass = ag.status === 'CONCLUIDO' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                    const alertHtml = ag.observacao ? `<div class="mt-2 text-sm text-red-600 font-medium">⚠️ Restrição: ${ag.observacao}</div>` : '';
                    const dataFormatada = new Date(ag.dataHora).toLocaleString('pt-BR');
                    const tipoServico = ag.tipoServico ? ag.tipoServico : 'Serviço não especificado';
                    
                    const nomePet = ag.pet ? ag.pet.nome : 'Sem nome';
                    const nomeTutor = ag.pet && ag.pet.nomeTutor ? ag.pet.nomeTutor : 'Não informado';
                    const nomeTecnico = ag.tecnico ? ag.tecnico.nome : 'Técnico não atribuído';

                    const card = `
                        <div class="bg-white rounded-lg shadow-sm border border-l-4 ${ag.status === 'CONCLUIDO' ? 'border-l-green-500 opacity-75' : 'border-l-yellow-500'} p-4 mb-4 flex items-center justify-between">
                            <div>
                                <span class="px-2 py-1 ${statusClass} text-xs rounded-full font-semibold" id="status-${ag.id}">${ag.status}</span>
                                <h3 class="text-lg font-bold text-gray-900 mt-2">Pet: ${nomePet} (Tutor: ${nomeTutor})</h3>
                                <p class="text-sm text-gray-600">${tipoServico} • Profissional: <b>${nomeTecnico}</b> • ID: #${ag.id}</p>
                                ${alertHtml}
                            </div>
                            <div class="text-right">
                                <div class="text-lg font-bold text-gray-800 mb-2">${dataFormatada}</div>
                                ${ag.status !== 'CONCLUIDO' ? 
                                `<button onclick="concluirServico(${ag.id})" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 transition">Concluir Serviço</button>` 
                                : ''}
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                console.error("Erro ao carregar agenda:", error);
                container.innerHTML = '<p class="text-red-500">Erro ao conectar com o servidor.</p>';
            }
        }

        async function concluirServico(id) {
            try {
                const response = await fetch(`/api/agendamentos/${id}/concluir`, {
                    method: 'PATCH'
                });

                if (response.ok) {
                    alert('Serviço concluído! Notificação enviada ao tutor.');
                    carregarAgenda();
                }
            } catch (error) {
                console.error("Erro ao atualizar status:", error);
            }
        }
    </script>
</body>
</html>
