<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PetAgende - Novo Agendamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-blue-900 text-white flex flex-col">
            <div class="p-6 text-2xl font-bold border-b border-blue-800">🐾 PetAgende</div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="/agendamento.html" class="block px-4 py-2 bg-blue-800 rounded">Novo Agendamento</a>
                <a href="/cadastro.html" class="block px-4 py-2 hover:bg-blue-800 rounded">Cadastrar Pet/Tutor</a>
            </nav>
            <div class="p-4 border-t border-blue-800 text-sm flex justify-between items-center">
                <div>Logado como: <br><b>Atendente</b></div>
                <form action="/logout" method="POST">
                    <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs font-bold transition">Sair</button>
                </form>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">Agendar Novo Serviço</h1>
            
            <div class="bg-white rounded-lg shadow p-6 max-w-2xl">
                <form id="formAgendamento" class="space-y-4">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Selecione o Pet</label>
                            <select id="petId" required class="mt-1 block w-full rounded-md border-gray-300 border p-2 bg-white">
                                <option value="">-- Carregando Pets --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Profissional Técnico</label>
                            <select id="tecnicoId" required class="mt-1 block w-full rounded-md border-gray-300 border p-2 bg-white">
                                <option value="">-- Carregando Técnicos --</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Serviço</label>
                        <select id="tipoServico" class="mt-1 block w-full rounded-md border-gray-300 border p-2 bg-white">
                            <option value="Banho e Tosa Completa">Banho e Tosa Completa</option>
                            <option value="Apenas Banho">Apenas Banho</option>
                            <option value="Tosa Higiênica">Tosa Higiênica</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Observação / Alergias</label>
                        <input type="text" id="observacao" placeholder="Ex: Alergia a perfume cítrico" class="mt-1 block w-full rounded-md border-gray-300 border p-2">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Data e Horário</label>
                        <input type="datetime-local" id="dataHora" required class="mt-1 block w-full rounded-md border-gray-300 border p-2 w-1/2">
                    </div>

                    <div id="mensagemAlerta" class="hidden p-3 rounded text-sm font-bold"></div>

                    <div class="pt-4 flex justify-end">
                        <button type="button" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 mr-2">Cancelar</button>
                        <button type="submit" class="bg-blue-600 border border-transparent rounded-md shadow-sm py-2 px-4 text-sm font-medium text-white hover:bg-blue-700">Confirmar Agendamento</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        window.onload = async function() {
            try {
                // Carrega Pets
                const resPets = await fetch('/api/pets');
                const pets = await resPets.json();
                const selectPet = document.getElementById('petId');
                selectPet.innerHTML = '<option value="">-- Selecione o Pet --</option>';
                pets.forEach(p => selectPet.innerHTML += `<option value="${p.id}">${p.nome} (${p.especie}) - Tutor: ${p.nomeTutor}</option>`);

                // Carrega Técnicos
                const resTecs = await fetch('/api/tecnicos');
                const tecs = await resTecs.json();
                const selectTec = document.getElementById('tecnicoId');
                selectTec.innerHTML = '<option value="">-- Selecione o Técnico --</option>';
                tecs.forEach(t => selectTec.innerHTML += `<option value="${t.id}">${t.nome} - ${t.especialidade}</option>`);
            } catch (error) {
                console.error("Erro ao carregar os dados:", error);
            }
        };

        document.getElementById('formAgendamento').addEventListener('submit', async function(event) {
            event.preventDefault(); 
            
            const alerta = document.getElementById('mensagemAlerta');
            alerta.className = 'hidden p-3 rounded text-sm font-bold mt-4';

            const dados = {
                dataHora: document.getElementById('dataHora').value,
                observacao: document.getElementById('observacao').value,
                tipoServico: document.getElementById('tipoServico').value,
                status: "AGENDADO",
                pet: { id: document.getElementById('petId').value },
                tecnico: { id: document.getElementById('tecnicoId').value }
            };

            try {
                const response = await fetch('/api/agendamentos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    alerta.innerText = "✅ Agendamento realizado com sucesso!";
                    alerta.classList.add('bg-green-100', 'text-green-800', 'block');
                    alerta.classList.remove('hidden');
                    document.getElementById('formAgendamento').reset();
                    window.onload(); // Recarrega os selects
                } else {
                    const erro = await response.text();
                    alerta.innerText = "⚠️ Erro: " + erro;
                    alerta.classList.add('bg-red-100', 'text-red-800', 'block');
                    alerta.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
            }
        });
    </script>
</body>
</html>
