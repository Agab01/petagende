<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PetAgende - Cadastrar Cliente e Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-blue-900 text-white flex flex-col">
            <div class="p-6 text-2xl font-bold border-b border-blue-800">🐾 PetAgende</div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="/agendamento.html" class="block px-4 py-2 hover:bg-blue-800 rounded">Novo Agendamento</a>
                <a href="/cadastro.html" class="block px-4 py-2 bg-blue-800 rounded">Cadastrar Pet/Tutor</a>            </nav>
            <div class="p-4 border-t border-blue-800 text-sm flex justify-between items-center">
                <div>Logado como: <br><b>Atendente</b></div>
                <form action="/logout" method="POST">
                    <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs font-bold transition">Sair</button>
                </form>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">Cadastro de Tutor e Pet</h1>
            
            <div class="bg-white rounded-lg shadow p-6 max-w-2xl">
                <form id="formCadastro" class="space-y-6">
                    
                    <div>
                        <h2 class="text-xl font-semibold text-gray-700 border-b pb-2 mb-4">Dados do Tutor</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nome do Tutor</label>
                                <input type="text" id="nomeTutor" required class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Telefone (WhatsApp)</label>
                                <input type="text" id="telefoneTutor" required placeholder="(XX) 9XXXX-XXXX" class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:border-blue-500">
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-xl font-semibold text-gray-700 border-b pb-2 mb-4">Dados do Pet</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nome do Pet</label>
                                <input type="text" id="nomePet" required class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Espécie / Raça</label>
                                <input type="text" id="especie" required placeholder="Ex: Cachorro - Poodle" class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:border-blue-500">
                            </div>
                        </div>
                        <div class="mt-4">
                            <label class="block text-sm font-medium text-gray-700">Alergias / Observações Médicas</label>
                            <input type="text" id="alergias" placeholder="Ex: Alergia a shampoo cítrico (Opcional)" class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:border-blue-500">
                        </div>
                    </div>

                    <div id="mensagemAlerta" class="hidden p-3 rounded text-sm font-bold"></div>

                    <div class="pt-4 flex justify-end">
                        <button type="reset" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 mr-2">Limpar</button>
                        <button type="submit" class="bg-blue-600 border border-transparent rounded-md shadow-sm py-2 px-4 text-sm font-medium text-white hover:bg-blue-700">Salvar Cadastro</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const alerta = document.getElementById('mensagemAlerta');
            alerta.className = 'hidden p-3 rounded text-sm font-bold mt-4';

            const dados = {
                nomeTutor: document.getElementById('nomeTutor').value,
                telefoneTutor: document.getElementById('telefoneTutor').value,
                nome: document.getElementById('nomePet').value,
                especie: document.getElementById('especie').value,
                alergias: document.getElementById('alergias').value
            };

            try {
                const response = await fetch('/api/pets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    alerta.innerText = "✅ Cadastro realizado com sucesso!";
                    alerta.classList.add('bg-green-100', 'text-green-800', 'block');
                    alerta.classList.remove('hidden');
                    document.getElementById('formCadastro').reset();
                } else {
                    alerta.innerText = "⚠️ Erro ao salvar cadastro.";
                    alerta.classList.add('bg-red-100', 'text-red-800', 'block');
                    alerta.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
            }
        });
    </script>
</body>
</html>
