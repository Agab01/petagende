<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetAgende - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md border-t-4 border-blue-600">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-900">🐾 PetAgende</h1>
            <p class="text-gray-500 mt-2">Acesse o sistema de gestão</p>
        </div>

        <form action="/login" method="POST" class="space-y-6">
            
            <div id="msgErro" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm text-center">
                Usuário ou senha incorretos!
            </div>

            <div id="msgLogout" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative text-sm text-center">
                Você saiu do sistema com segurança.
            </div>

            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Usuário</label>
                <input type="text" id="username" name="username" placeholder="admin ou tecnico" required
                    class="mt-1 block w-full rounded-md border-gray-300 border p-3 focus:border-blue-500 focus:ring-blue-500 outline-none transition">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required
                    class="mt-1 block w-full rounded-md border-gray-300 border p-3 focus:border-blue-500 focus:ring-blue-500 outline-none transition">
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-900"> Lembrar de mim </label>
                </div>
            </div>

            <button type="submit" 
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
                Entrar
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-400">
            &copy; 2026 UCSAL - Engenharia de Requisitos
        </div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('error')) {
                document.getElementById('msgErro').classList.remove('hidden');
            }
            if (urlParams.has('logout')) {
                document.getElementById('msgLogout').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
